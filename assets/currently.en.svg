<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Currently: building my experience with every project. Open to opportunities in software development and technical support / cloud." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".4"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gA"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect x="10" y="10" width="880" height="150" rx="20"/></clipPath>
</defs>
<rect x="10" y="10" width="880" height="150" rx="20" fill="#0b1020" fill-opacity=".72"/>
<g clip-path="url(#card)">
  <ellipse cx="120" cy="40" rx="260" ry="120" fill="url(#gA)"/>
  <rect x="-220" y="10" width="220" height="150" fill="url(#sh)"><animateTransform attributeName="transform" type="translate" values="0 0;1140 0" dur="7s" repeatCount="indefinite"/></rect>
</g>
<rect x="10" y="10" width="880" height="150" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>

<text x="40" y="58" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#f1f5f9" opacity="0">Building my experience with every project.
<animate attributeName="opacity" values="0;1" dur=".8s" begin=".2s" fill="freeze"/></text>
<text x="40" y="86" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8" opacity="0">Continuously growing in engineering, architecture and product thinking.
<animate attributeName="opacity" values="0;1" dur=".8s" begin=".6s" fill="freeze"/></text>

<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".8s" begin="1s" fill="freeze"/>
  <rect x="40" y="106" width="626.4" height="36" rx="18" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".5"/>
  <circle cx="62" cy="124" r="5" fill="#34d399"/>
  <circle cx="62" cy="124" r="5" fill="none" stroke="#34d399"><animate attributeName="r" values="5;13" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle>
  <text x="80" y="129" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#6ee7b7">Open to opportunities · software development and technical support / cloud</text>
</g>
</svg>